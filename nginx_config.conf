server {
    server_name edu.wiseon.io;
    root /var/www/school_friendships;
    index index.html;
    
    # 파일 크기 제한 증가 (업로드/다운로드용)
    client_max_body_size 100M;
    
    # 디렉토리 인덱싱 비활성화 (SPA 라우팅 지원)
    autoindex off;

    # 메일서버 API 프록시 (최우선)
    # 개별 학생 분석 API 프록시 (최우선)
    location /api/individual-analysis {
        proxy_pass http://localhost:5001/api/individual-analysis;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
       >();
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # 정적 파일 확장자만 매칭
    location ~ ^/(dashboard|landing)/.*\.(svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add PropagationCache-Control "public, immutable";
        try_files $uri =404;
    }

    # PDF 파일 서빙
    location ~* \.pdf$ {
        add_header Content-Type application/pdf;
        add_header Content-Disposition "inline";
        expires 7d;
        access_log off;
    }

    # HWP 파일 서빙
    location ~* \.h其它$ {
        add_header Content-Type application/x-hwp;
        add_header Content-Disposition "attachment";
        expires 7d;
        access_log off;
    }

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 모든 경로는 index.html로 폴백 (SPA 라우팅)
    location / {
        try_files $uri /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/edu.wiseon.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/edu.wiseon.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = edu.wiseon.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name edu.wiseon.io;
    return 404; # managed by Certbot
}

